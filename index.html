<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solar System — Educational 3D Model</title>
<style>
  :root{
    --bg:#05060a; --panel:rgba(14,18,28,0.82); --panel-solid:#0e121c;
    --line:rgba(120,150,220,0.18); --txt:#dfe6ff; --dim:#8ea0c8; --accent:#6db3ff;
    --accent2:#ffb454;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none}
  canvas{display:block;position:absolute;inset:0;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}

  /* ---- top bar ---- */
  #topbar{position:absolute;top:0;left:0;right:0;height:52px;z-index:20;
    display:flex;align-items:center;gap:14px;padding:0 16px;
    background:linear-gradient(180deg,rgba(8,10,18,0.9),rgba(8,10,18,0));
    pointer-events:none}
  #topbar .brand{font-weight:700;letter-spacing:.5px;font-size:15px;
    color:#fff;pointer-events:auto;white-space:nowrap}
  #topbar .brand span{color:var(--accent)}
  #clock{pointer-events:none;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}

  /* ---- controls dock ---- */
  #dock{position:absolute;left:14px;bottom:14px;z-index:20;max-width:340px;
    background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row.first{margin-top:0}
  label.lbl{font-size:11px;color:var(--dim);min-width:46px;text-transform:uppercase;letter-spacing:.5px}
  input[type=range]{flex:1;accent-color:var(--accent);height:4px}
  .btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  button{background:rgba(60,80,130,0.25);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;transition:.12s;
    font-family:inherit}
  button:hover{background:rgba(90,120,200,0.38);border-color:var(--accent)}
  button.active{background:var(--accent);color:#05101f;border-color:var(--accent);font-weight:600}
  .playbtn{min-width:74px}
  #speedval{font-variant-numeric:tabular-nums;color:var(--accent2);font-size:12px;min-width:70px;text-align:right}

  /* ---- object list ---- */
  #objlist{position:absolute;right:14px;top:62px;z-index:20;
    background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);
    border-radius:14px;padding:8px;max-height:calc(100vh - 140px);overflow-y:auto;
    width:176px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  #objlist::-webkit-scrollbar{width:6px}
  #objlist::-webkit-scrollbar-thumb{background:rgba(120,150,220,.35);border-radius:3px}
  .objtitle{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;
    padding:4px 8px 6px}
  .objbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    border-radius:9px;border-color:transparent;background:transparent;padding:7px 8px;margin:2px 0}
  .objbtn:hover{background:rgba(90,120,200,0.24)}
  .objbtn.sel{background:rgba(109,179,255,0.22);border-color:var(--accent)}
  .swatch{width:15px;height:15px;border-radius:50%;flex:none;box-shadow:0 0 6px rgba(255,255,255,.15)}
  .objbtn .nm{font-size:13px}
  .objbtn .ty{font-size:9px;color:var(--dim);display:block}

  /* ---- info panel ---- */
  #infopanel{position:absolute;right:14px;bottom:14px;z-index:22;width:320px;
    background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;
    padding:18px;box-shadow:0 16px 50px rgba(0,0,0,.6);display:none}
  #infopanel h2{margin:0 0 2px;font-size:22px}
  #infopanel .sub{color:var(--accent);font-size:12px;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
  #infopanel .desc{color:var(--dim);font-size:13px;line-height:1.5;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:rgba(60,80,130,0.16);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .stat .k{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:14px;font-weight:600;margin-top:2px}
  #closeinfo{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;
    padding:0;font-size:16px;line-height:1}
  .facts{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .facts .ft{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
  .facts .ft span:first-child{color:var(--dim)}

  /* ---- legend / help ---- */
  #help{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:19;
    color:var(--dim);font-size:11.5px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:6px 14px;pointer-events:none;opacity:.9;text-align:center}
  #loading{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;background:var(--bg)}
  #loading .spin{width:44px;height:44px;border:3px solid rgba(120,150,220,.25);
    border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loading .txt{color:var(--dim);font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbar">
  <div class="brand">Solar&nbsp;System<span>·3D</span></div>
  <div id="clock">Loading…</div>
</div>

<div id="dock">
  <div class="row first">
    <button id="playBtn" class="playbtn active">❚❚ Pause</button>
    <div id="speedval">1 day/s</div>
  </div>
  <div class="row">
    <label class="lbl">Speed</label>
    <input type="range" id="speed" min="0" max="1000" value="40">
  </div>
  <div class="row">
    <label class="lbl">Zoom</label>
    <input type="range" id="zoom" min="5" max="800" value="100">
  </div>
  <div class="btnrow">
    <button id="tOrbits" class="active">Orbits</button>
    <button id="tLabels" class="active">Labels</button>
    <button id="tRings" class="active">Rings</button>
    <button id="tBelt" class="active">Belts</button>
    <button id="tSolarW" class="active">Solar Wind</button>
    <button id="fitSun">Fit Sun</button>
    <button id="today">Today</button>
  </div>
</div>

<div id="objlist"><div class="objtitle">Objects</div><div id="objlistbody"></div></div>

<div id="infopanel">
  <button id="closeinfo">✕</button>
  <h2 id="ititle">—</h2>
  <div class="sub" id="isub">—</div>
  <div class="desc" id="idesc"></div>
  <div class="grid" id="istat"></div>
  <div class="facts" id="ifacts"></div>
</div>

<div id="help">Drag to orbit · Scroll to zoom · Double-click a body to focus · Click a planet to inspect</div>

<div id="loading"><div class="spin"></div><div class="txt">Building the Solar System…</div></div>

const TWO_PI = Math.PI*2;

// J2000 orbital elements (degrees). a in AU, e eccentricity, i inclination,
// Omega longitude of ascending node, rho-v bar = longitude of perihelion,
// Lbar = mean longitude at J2000. period in Earth-days.
function orb(a,e,i,Om,rov,Lbar,period){
  return {a,e,i:i*DEG,Omega:Om*DEG,omega:(rov-Om)*DEG,L:Lbar*DEG,period:period};
}

// Tuned so inner planets are visible while the Sun stays a dominant disc.

// Precompute a per-body display radius in world units (amplified, Sun reduced).

/* ---------- 2. MATH / CAMERA ----------------------------------------- */
const V = (x,y,z)=>({x,y,z});
function cross(a,b){return V(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x);}
function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z;}
function sub(a,b){return V(a.x-b.x,a.y-b.y,a.z-b.z);}
function add(a,b){return V(a.x+b.x,a.y+b.y,a.z+b.z);}
function scale(a,s){return V(a.x*s,a.y*s,a.z*s);}
function len(a){return Math.hypot(a.x,a.y,a.z);}
function norm(a){const l=len(a)||1;return V(a.x/l,a.y/l,a.z/l);}

const cam = {
  yaw: 0.6, pitch: 0.5, dist: 300, target: V(0,0,0),
  fov: 55*DEG,
};
const VIEW = {
  showOrbits:true, showLabels:true, showRings:true, showBelt:true, showWind:true,
  playing:true,
};

// Camera basis + project a world point -> {x,y,zc,dx,dy,scale} (null if behind).
const aspectRef={w:1,h:700};
function project(P){
  // direction camera -> point
  const dx=P.x-cam.target.x, dy=P.y-cam.target.y, dz=P.z-cam.target.z;
  const sy=Math.sin(cam.yaw), cosy=Math.cos(cam.yaw);
  const sp=Math.sin(cam.pitch), spy=Math.cos(cam.pitch);
  // rotate so camera sits at +dist on its forward axis looking toward target
  const b=camBasis();
  const fx=b.forward.x, fy=b.forward.y, fz=b.forward.z;
  // camera sits behind target along the forward axis, looking toward it
  const camPos=V(cam.target.x-fx*cam.dist, cam.target.y-fy*cam.dist, cam.target.z-fz*cam.dist);
  const rel=sub(P,camPos);
  const zc=dot(rel,V(fx,fy,fz));      // positive depth when point is in front
  if(zc < 0.001) return null;
  const xc=dot(rel,b.right), yc=dot(rel,b.up);
  const f=1/Math.tan(cam.fov/2);
  const s=(aspectRef.h/2)/zc*f;
  return {x:aspectRef.w/2+xc*s, y:aspectRef.h/2-yc*s, zc, s, depth:zc};
}
// Build an orthonormal camera basis {forward, right, up}.
// Robust against the degenerate case where forward is parallel to world-up
// (looking straight up/down), which would make the cross product zero and
// produce NaN that crashes createRadialGradient / the whole frame loop.
function camBasis(){
  const sy=Math.sin(cam.yaw), cosy=Math.cos(cam.yaw);
  const sp=Math.sin(cam.pitch), spy=Math.cos(cam.pitch);
  const fx=sy*spy, fy=-sp, fz=cosy*spy;          // forward (unit)
  var hint=V(0,1,0);
  if(Math.abs(-fy)>0.99) hint=V(0,0,1.0);         // looking nearly straight up/down
  var right=norm(cross(V(fx,fy,fz),hint));        // unit
  var trueUp=cross(right,V(fx,fy,fz));            // unit (orthonormal)
  return {forward:V(fx,fy,fz), right:right, up:trueUp};
}
// world->camera depth (for painter sort)
function camDepth(P){
  const fx=-Math.sin(cam.yaw)*Math.cos(cam.pitch);
  const fy=Math.sin(cam.pitch), fz=-Math.cos(cam.yaw)*Math.cos(cam.pitch);
  return (P.x-cam.target.x)*fx+(P.y-cam.target.y)*fy+(P.z-cam.target.z)*fz;
}

/* ---------- 3. KEPLER ----------------------------------------------- */
function solveKepler(M,e){
  M=((M%TWO_PI)+TWO_PI)%TWO_PI;
  let E=M + e*Math.sin(M);            // initial guess
  for(let k=0;k<6;k++){
    const dE=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
    E-=dE; if(Math.abs(dE)<1e-7) break;
  }
  return E;
}
function heliocentric(b,tYears){
  // mean anomaly now
  const periodYr = b.period/365.256;
  const M = b.o.L + (TWO_PI/periodYr)*tYears;
  const E = solveKepler(M,b.o.e);
  const nu = 2*Math.atan2(Math.sqrt(1+b.o.e)*Math.sin(E/2), Math.sqrt(1-b.o.e)*Math.cos(E/2));
  const r = b.o.a*(1-b.o.e*Math.cos(E));           // AU
  const xorb=r*Math.cos(nu), yorb=r*Math.sin(nu);
  const cO=Math.cos(b.o.Omega), sO=Math.sin(b.o.Omega);
  const cI=Math.cos(b.o.i), sI=Math.sin(b.o.i);
  const cw=Math.cos(b.o.omega+nu), sw=Math.sin(b.o.omega+nu);
  // ecliptic coords (x toward vernal equinox, z north)
  const x=(cO*cw - sO*sw*cI)*r;
  const y=(sO*cw + cO*sw*cI)*r;
  const z=(sw*sI)*r;
  return {x:x*DIST, y:z*DIST, z:-y*DIST};  // note: y<->z so ecliptic plane is XZ (compressed scale)
}
function bodyPos(b,tYears){
  if(b.key==="sun") return V(0,0,0);
  return heliocentric(b,tYears);
}
// moon position relative to parent (local, in world units)
function moonLocal(m,tYears){
  const pYr=m.period/365.256;
  const a=(m.angle||0)+(TWO_PI/pYr)*tYears;
  const inc=(m.parent.tilt||23)*0.0; // approximate flat for clarity
  return V(Math.cos(a)*m.orbitR, 0, Math.sin(a)*m.orbitR);
}

/* ---------- 4. UTIL / FORMATTING ----------------------------------- */
function fmtSci(n){
  if(n===0) return "0";
  const exp=Math.floor(Math.log10(n)), mant=n/Math.pow(10,exp);
  const sup=["⁰","¹","²","³","⁴","⁵","⁶","⁷","⁸","⁹"];
  const e="×10"+String(exp).split("").map(d=>sup[+d]).join("");
  return mant.toFixed(1)+e;
}
function fmtTempK(k){
  const K=k, C=k-273.15, F=(k-273.15)*9/5+32;
  return `${Math.round(C)} °C`;
}
function fmtDay(h){
  if(Math.abs(h)<48) return (h>0?"":"−")+Math.abs(h).toFixed(2)+" h";
  return (h>0?"":"−")+Math.abs(h/24).toFixed(1)+" d";
}

/* ---------- 5. RENDERERS -------------------------------------------- */
const ctxEl=()=>document.getElementById("c").getContext("2d");
let ctx=null, W=0,H=0, DPR=1;

function resize(){
  const c=document.getElementById("c");
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;

// ---- starfield skybox (a 3D dome of stars surrounding the camera) ----
// Stars live on directions (unit vectors) so the dome always surrounds the
// camera no matter where it flies -> a real skybox, not a flat backdrop.
let stars3D=null;
function makeStars(n){
  stars3D=new Array(n);
  for(let i=0;i<n;i++){
    const u=Math.random()*2-1;                     // cos(theta) in [-1,1]
    const th=Math.random()*TWO_PI;
    const rt=Math.sqrt(Math.max(0,1-u*u));
    stars3D[i]={
      dx:rt*Math.cos(th), dy:u, dz:rt*Math.sin(th),
      size:Math.random()*1.7+0.3,
      a:Math.random()*0.6+0.4,
      tint:Math.random()
    };
  }
}
// project a star direction onto the current camera basis -> screen point (null if behind)
function starScreen(st){
  const b=camBasis();
  const zx=st.dx*b.forward.x+st.dy*b.forward.y+st.dz*b.forward.z;
  const xx=st.dx*b.right.x+st.dy*b.right.y+st.dz*b.right.z;
  const yy=st.dx*b.up.x+st.dy*b.up.y+st.dz*b.up.z;
  if(zx<=0) return null;                        // behind the camera
  const f=1/Math.tan(cam.fov/2);
  const s=(aspectRef.h/2)/zx*f;
  return {x:aspectRef.w/2+xx*s, y:aspectRef.h/2-yy*s};
}
// faint nebula glow so deep space isn't flat black.
// Nebula blobs live on sky directions so they rotate with the camera like the stars.
// Each blob is a soft radial glow sized to a fraction of the screen.
let nebula=null;
function makeNebula(){
  const S=Math.min(aspectRef.w,aspectRef.h)*0.42; // glow radius, ~42% of shortest edge
  nebula=[
    {dx:-0.72, dy:0.18, dz:-0.66, size:S, color:[70,45,120]},
    {dx: 0.60, dy:0.34, dz:-0.73, size:S*1.08, color:[30,60,130]},
    {dx: 0.20, dy:-0.55, dz:-0.81, size:S*0.9, color:[40,70,110]}
  ];
}
function drawNebula(){
  ctx.save();
  for(let i=0;i<nebula.length;i++){
    const nb=nebula[i];
    const p=starScreen({dx:nb.dx,dy:nb.dy,dz:nb.dz}); if(!p) continue;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,nb.size);
    const [r,gg,bb]=nb.color;
    g.addColorStop(0,"rgba("+r+","+gg+","+bb+",0.10)");
    g.addColorStop(0.6,"rgba("+r+","+gg+","+bb+",0.04)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;
    ctx.fillRect(p.x-nb.size,p.y-nb.size,nb.size*2,nb.size*2);
  }
  ctx.restore();
}
function drawStars(){
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  const now=performance.now();
  for(let i=0;i<stars3D.length;i++){
    const st=stars3D[i];
    const p=starScreen(st); if(!p) continue;
    const tw=0.7+0.3*Math.sin(now*0.004+st.dx*3.0);
    const a=st.a*tw;
    if(st.tint<0.7) ctx.fillStyle="rgba(255,255,255,"+a.toFixed(2)+")";
    else if(st.tint<0.87) ctx.fillStyle="rgba(190,216,255,"+a.toFixed(2)+")";
    else ctx.fillStyle="rgba(255,233,200,"+a.toFixed(2)+")";
    ctx.beginPath(); ctx.arc(p.x,p.y,st.size,0,TWO_PI); ctx.fill();
  }
  ctx.restore();
}

// ---- lit sphere with optional bands ----
function drawSphere(P,radiusKm,baseColor,bands,atmo,isSun){
  const pr=project(P); if(!pr||pr.s*radiusKm<0.05) return {drawn:false};
  const scr = pr.s*radiusKm;             // screen radius (px)
  if(scr<0.15) return {drawn:false,scr};
  const lightDir = norm(sub(sunBody, P));            // world dir planet→sun
  const lfx=-lightDir.x*Math.sin(cam.yaw)*Math.cos(cam.pitch)
           -lightDir.y*Math.sin(cam.pitch)
           -lightDir.z*Math.cos(cam.yaw)*Math.cos(cam.pitch);
  const lfy=lightDir.x*Math.sin(cam.yaw)           +lightDir.z*Math.cos(cam.yaw);
  const lfz=-lightDir.x*Math.sin(cam.pitch)*Math.cos(cam.yaw)
           +lightDir.y*Math.cos(cam.pitch)
           -lightDir.z*Math.sin(cam.pitch)*Math.cos(cam.yaw);
  const b=camBasis();
  const lx=dot(lightDir,b.right), ly=dot(lightDir,b.up);

  const sx=pr.x, sy=pr.y;
  // glow / atmosphere halo
  if(atmo && !isSun){
    ctx.save();
    const g=ctx.createRadialGradient(sx,sy,scr*0.9,sx,sy,scr*1.9);
    const c=hexToRgb(baseColor);
    g.addColorStop(0,`rgba(${c.r},${c.g},${c.b},0.28)`);
    g.addColorStop(1,`rgba(${c.r},${c.g},${c.b},0)`);
    ctx.fillStyle=g; ctx.beginPath();ctx.arc(sx,sy,scr*1.9,0,TWO_PI);ctx.fill();
    ctx.restore();
  }
  // base disc
  ctx.save();
  ctx.beginPath();ctx.arc(sx,sy,scr,0,TWO_PI);ctx.clip();
  // base fill with terminator shading (light offset)
  const off=Math.hypot(lx,ly)||1;
  const ox=lx/off*scr*0.35, oy=ly/off*scr*0.35;
  const g=ctx.createRadialGradient(sx+ox,sy+oy,scr*0.05,sx,sy,scr);
  const c=hexToRgb(baseColor);
  const lit=`rgba(${Math.min(255,c.r*1.5)|0},${Math.min(255,c.g*1.5)|0},${Math.min(255,c.b*1.5)|0},1)`;
  g.addColorStop(0.25,lit);
  g.addColorStop(0.7,`rgba(${c.r},${c.g},${c.b},1)`);
  g.addColorStop(1,"rgba(6,8,18,1)");
  ctx.fillStyle=g; ctx.fillRect(sx-scr,sy-scr,scr*2,scr*2);
  // bands (latitudes)
  if(bands){
    for(const bd of bands){
      ctx.fillStyle=bd.c;
      const by=sy+bd.y*scr;
      ctx.fillRect(sx-scr,by-scr*0.11,scr*2,scr*0.22);
    }
  }
  // simple surface mottling for terrestrial planets
  ctx.restore();
  return {drawn:true,scr,sx,sy};
}

function hexToRgb(h){
  h=h.replace('#',''); if(h.length===3)h=h.split("").map(x=>x+x).join("");
  return {r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)};
}

// ---- Saturn-style rings, split back/front for correct occlusion ----
// `half` selects which half of the ring to draw:
//   "back" -> points farther from the camera than the planet centre (drawn FIRST)
//   "front"-> points nearer (drawn OVER the planet disc)
// Previously the whole ring was drawn in one pass after the planet, so the back
// half painted on top of the disc and the rings looked like a flat band floating
// in the wrong place instead of wrapping the planet.
function drawRings(planet, planetPos, ring, half){
  if(!ring) return;
  const inner=ring.inner, outer=ring.outer;
  const n=200;
  const tilt=planet.tilt?planet.tilt*DEG:26*DEG;   // ring plane tilt (deg)
  const cT=Math.cos(tilt), sT=Math.sin(tilt);
  const renderR=planet.renderR;
  const planetDepth=camDepth(planetPos);
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(let k=0;k<n;k++){
    const ang=(k/n)*TWO_PI;
    const t=(k/n);                                   // radial position 0..1
    const R=(inner + (outer-inner)*t)*renderR;       // world-units radius
    // ring offset in the planet's local equatorial plane (x-z), THEN tilt.
    // Tilt must rotate the offset around the planet's centre, not the absolute
    // world position: rotating planetPos.x/z directly bakes planetPos.z*sin(tilt)
    // into every point, shifting the whole ring far away from the planet when it
    // is far from the camera (the "rings in the wrong spot" bug).
    const ox=Math.cos(ang)*R;
    const oz=Math.sin(ang)*R;
    // rotate (ox, 0, oz) about the local x-axis by `tilt`
    const lx=ox;
    const ly=-oz*sT;
    const lz=oz*cT;
    // world position = planet centre + tilted local offset
    const wx=planetPos.x+lx;
    const wy=planetPos.y+ly;
    const wz=planetPos.z+lz;
    const wp=project(V(wx, wy, wz));
    if(!wp)continue;
    // depth-based split: ring point farther from the camera than the planet
    // centre = back half (drawn first), nearer = front half (drawn over disc).
    const behind = camDepth(V(wx, wy, wz)) > planetDepth;
    if((half==="back"&&!behind)||(half==="front"&&behind)) continue;
    // colour sampled from the ring's gradient stops, blended smoothly
    const col=ringColor(ring,t);
    const radius=Math.max(0.4, wp.s*(outer-inner)*renderR*0.055);
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(wp.x,wp.y,radius,0,TWO_PI);ctx.fill();
  }
  ctx.restore();
}
function ringColor(ring,t){
  const stops=ring.colors;
  // map t (0..1) onto colour stops
  const idx=t*(stops.length-1);
  const i=Math.min(stops.length-2,Math.floor(idx));
  const f=idx-i;
  return stops[i]; // approximate (already a rgba string); blend not critical
}

// ---- orbit path line ----
function drawOrbit(b){
  if(b.key==="sun"||!VIEW.showOrbits) return;
  const N=180; const pts=[];
  for(let k=0;k<=N;k++){
    const tYears=(k/N)* (b.period/365.256);
    const p=bodyPos(b,tYears);
    const pr=project(p); if(pr) pts.push(pr);
  }
  if(pts.length<2) return;
  ctx.save(); ctx.strokeStyle="rgba(120,160,240,0.22)"; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke(); ctx.restore();
}

// ---- label ----
function drawLabel(b,pr,scr){
  if(!VIEW.showLabels||pr==null||scr<1) return;
  ctx.save();
  ctx.font="12px 'Segoe UI',sans-serif";
  ctx.textAlign="center";
  ctx.fillStyle="rgba(225,232,255,0.85)";
  ctx.fillText(b.name, pr.x, pr.y-scr-7);
  ctx.restore();
}

/* ---------- 6. PARTICLE SYSTEMS ------------------------------------- */
// Shared arrays
let stars=[];
let asteroids=[];
let kuiper=[];
let solarWind=[];
let cometTails={};

function makeBelt(count,minAU,maxAU,incl,seed){
  const arr=[];
  let s=seed||12345;
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  for(let i=0;i<count;i++){
    const a=minAU+rnd()*(maxAU-minAU);
    const e=rnd()*0.16;
    const inc=(rnd()-0.5)*2*incl;
    const Om=rnd()*360;
    const rov=Om+rnd()*10;
    const L=rnd()*360;
    arr.push({a,e,i:inc*DEG,Omega:Om*DEG,omega:(rov-Om)*DEG,L:L*DEG,period:a/ (1)**0.5*365.256*Math.pow(a,1.5)/1,
             phase:rnd()*TWO_PI, size:0.6+rnd()*1.4, color:0.5+rnd()*0.4});
    arr[i].period = 365.256*Math.pow(a,1.5); // kepler: P(yr)=a^1.5 -> days
  }
  return arr;
}

function initBelt(){
  asteroids=makeBelt(1600,2.1,3.3,12,11);
  kuiper=makeBelt(2200,30,48,3,99);
  solarWind=new Array(900).fill(0).map(()=>makeWindParticle());
  // seed comets with tails
  BODIES.forEach(b=>{ if(b.isComet) cometTails[b.key]={p:[]}; });
}

function makeWindParticle(){
  const th=Math.random()*TWO_PI, ph=Math.random()*Math.PI*0.5+0.2;
  return {vx:Math.sin(ph)*Math.cos(th),vy:Math.cos(ph)-0.5,vz:Math.sin(ph)*Math.sin(th),
          life:Math.random(),max:1,r:0.7+Math.random()*1.4};
}

function updateWind(dt,tYears){
  const sp=bodyPos(sunBody,tYears);
  for(const p of solarWind){
    p.life+=dt*0.35;
    // move outward from sun
    const l=Math.hypot(p.vx,p.vy,p.vz)||1;
    p.vx/=l;p.vy/=l;p.vz/=l;
    const speed=dt* (30+Math.random()*20);
    p.x=(p.x===undefined?sp.x:p.x)+p.vx*speed;
    p.y=(p.y===undefined?sp.y:p.y)+p.vy*speed;
    p.z=(p.z===undefined?sp.z:p.z)+p.vz*speed;
    if(p.life>1||Math.hypot(p.x-sp.x,p.y-sp.y,p.z-sp.z)>24*DIST){
      Object.assign(p,makeWindParticle());
    }
  }
}

function updateCometTail(b,curPos,t){
  const tail=b.tail; if(!tail) return;
  const tp=project(curPos); if(!tp) return;
  const dir=norm(sub(curPos, sunBody));  // away from sun
  const life=1/(0.4 + Math.hypot(curPos.x-sunBody.x,curPos.y-sunBody.y,curPos.z-sunBody.z)/DIST*0.5);
  // spawn head
  const tp2=project(curPos);
  const nSpawn=2;
  for(let k=0;k<nSpawn;k++){
    tail.p.push({x:curPos.x,y:curPos.y,z:curPos.z,
      life:0,max:0.6+Math.random()*0.8,
      ox:(Math.random()-0.5)*b.radius*radiusScale*2,
      oy:(Math.random()-0.5)*b.radius*radiusScale*2});
  }
  // integrate
  for(let i=tail.p.length-1;i>=0;i--){
    const p=tail.p[i]; p.life+=t;
    // push away from sun (dust tail curves; ion tail straight)
    const toSun=norm(sub(sunBody,p));
    const pull=dir; // away
    p.x+=pull.x*tail.bd*t*0.6 + p.ox;
    p.y+=pull.y*tail.bd*t*0.6 + p.oy;
    p.z+=pull.z*tail.bd*t*0.6;
  }
  // cap
  while(tail.p.length>tail.max) tail.p.shift();
}

function drawBelt(arr,tYears){
  if(!VIEW.showBelt) return;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const a of arr){
    // position via same heliocentric formula
    const periodYr=a.period/365.256;
    const M=a.L + (TWO_PI/periodYr)*tYears;
    const E=solveKepler(M,a.e);
    const nu=2*Math.atan2(Math.sqrt(1+a.e)*Math.sin(E/2),Math.sqrt(1-a.e)*Math.cos(E/2));
    const r=a.a*(1-a.e*Math.cos(E));
    const cO=Math.cos(a.o?0:a.Omega)||1,sO=Math.sin(a.Omega);
    const cI=Math.cos(a.i),sI=Math.sin(a.i);
    const cw=Math.cos(a.omega+nu),sw=Math.sin(a.omega+nu);
    const x=(cO*cw-sO*sw*cI)*r, y=(sO*cw+cO*sw*cI)*r, z=(sw*sI)*r;
    const p=project(V(x*DIST, z*DIST, -y*DIST));
    if(!p)continue;
    const cr=p.s*a.size*0.5;
    if(cr<0.15)continue;
    const g=0.35*a.color;
    ctx.fillStyle=`rgba(${(200*g)|0},${(190*g)|0},${(170*g)|0},0.9)`;
    ctx.beginPath();ctx.arc(p.x,p.y,cr,0,TWO_PI);ctx.fill();
  }
  ctx.restore();
}

// solar wind + comet tails drawn with additive blending
function drawWind(tYears){
  if(!VIEW.showWind) return;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const p of solarWind){
    const pr=project(V(p.x,p.y,p.z)); if(!pr)continue;
    const cr=pr.s*p.r; if(cr<0.1)continue;
    const a=(1-p.life)*0.5;
    ctx.fillStyle=`rgba(120,180,255,${a})`;
    ctx.beginPath();ctx.arc(pr.x,pr.y,cr,0,TWO_PI);ctx.fill();
  }
  ctx.restore();
}

function drawCometTails(tYears){
  BODIES.forEach(b=>{ if(!b.isComet||!cometTails[b.key])return;
    const tp=project(b.pos); if(!tp)return;
    ctx.save(); ctx.globalCompositeOperation="lighter";
    for(const p of cometTails[b.key].p){
      const pr=project(V(p.x,p.y,p.z)); if(!pr)continue;
      const cr=pr.s*1.2*(1-p.life);
      if(cr<0.1)continue;
      const a=(1-p.life)*0.6;
      ctx.fillStyle=`rgba(160,220,255,${a})`;
      ctx.beginPath();ctx.arc(pr.x,pr.y,cr,0,TWO_PI);ctx.fill();
    }
    ctx.restore();
  });
}

// sun glow (radial)
function drawSun(pr){
  if(!pr) return;
  const scr=pr.s*sunBody.renderR;
  const sx=pr.x, sy=pr.y;
  // corona
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  const c1=ctx.createRadialGradient(sx,sy,scr*0.2,sx,sy,scr*4.2);
  c1.addColorStop(0,"rgba(255,230,150,0.9)");
  c1.addColorStop(0.15,"rgba(255,190,80,0.55)");
  c1.addColorStop(0.4,"rgba(255,150,40,0.18)");
  c1.addColorStop(1,"rgba(255,120,20,0)");
  ctx.fillStyle=c1; ctx.beginPath();ctx.arc(sx,sy,scr*4.2,0,TWO_PI);ctx.fill();
  // bright core
  const c2=ctx.createRadialGradient(sx,sy,0,sx,sy,scr);
  c2.addColorStop(0,"#fffef0");c2.addColorStop(0.5,"#ffe58a");c2.addColorStop(1,"#ffab2a");
  ctx.fillStyle=c2; ctx.beginPath();ctx.arc(sx,sy,scr,0,TWO_PI);ctx.fill();
  ctx.restore();
}

/* ---------- 7. TIME & STATE ----------------------------------------- */
let tYears = 0;             // years after J2000.0
let startTime = Date.now()/1000;
let simSpeed = 1;           // days simulated per real second
let selected = null;

function setToday(){
  // real current date ~ year 2026 => tYears from 2000
  const yr = new Date().getFullYear()+ (new Date().getMonth())/12;
  tYears = yr - 2000;
}

/* ---------- 8. UI WIRING -------------------------------------------- */
function buildList(){
  const body=document.getElementById("objlistbody");
  body.innerHTML="";
  BODIES.forEach(b=>{
    const btn=document.createElement("button");
    btn.className="objbtn"; btn.dataset.key=b.key;
    btn.innerHTML=`<span class="swatch" style="background:${b.color}"></span>
      <span><span class="nm">${b.name}</span><span class="ty">${b.type}</span></span>`;
    btn.onclick=()=>selectBody(b);
    body.appendChild(btn);
  });
}
let followBody=null, flyTarget=null, flyDist=null;
function selectBody(b){
  selected=b;
  document.querySelectorAll(".objbtn").forEach(e=>e.classList.toggle("sel",e.dataset.key===b.key));
  showInfo(b);
  // fly the camera in and lock onto the body as it orbits
  followBody=b;
  flyTarget=bodyPos(b,tYears);
  flyDist=Math.max(16,(b.renderR||15)*9);
}
function unfollow(){ followBody=null; flyTarget=null; flyDist=null; }

function showInfo(b){
  const p=document.getElementById("infopanel");
  p.style.display="block";
  document.getElementById("ititle").textContent=b.name;
  document.getElementById("isub").textContent=b.type;
  document.getElementById("idesc").textContent=b.desc||"";
  const st=document.getElementById("istat"); st.innerHTML="";
  const stats=[];
  if(b.radius) stats.push(["Radius",Number(b.radius).toLocaleString()+" km"]);
  if(b.mass) stats.push(["Mass",fmtSci(b.mass)+" kg"]);
  if(b.o){
    const aAU=(b.o.a);
    stats.push(["Distance",aAU.toFixed(2)+" AU"]);
    stats.push(["Orbital period",periodText(b)]);
    stats.push(["Eccentricity", (b.o.e).toFixed(3)]);
    stats.push(["Inclination",(b.o.i/DEG).toFixed(2)+"°"]);
  }
  if(b.rot!=null) stats.push(["Rotation",fmtDay(b.rot)]);
  if(b.tilt!=null) stats.push(["Axial tilt",(b.tilt).toFixed(1)+"°"]);
  if(b.moons) stats.push(["Known moons",(Array.isArray(b.moons)?b.moons:[b.moon]).length]);
  if(b.o&&b.o.a!=null && b.o.a>0){
    // approximate
  }
  stats.slice(0,6).forEach(([k,v])=>{
    const d=document.createElement("div");d.className="stat";
    d.innerHTML=`<div class="k">${k}</div><div class="v">${v}</div>`;
    st.appendChild(d);
  });
  const fc=document.getElementById("ifacts"); fc.innerHTML="";
  if(b.facts){
    fc.innerHTML='<div style="color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Key facts</div>';
    for(const [k,v] of Object.entries(b.facts)){
      const d=document.createElement("div");d.className="ft";
      d.innerHTML=`<span>${k}</span><span>${v}</span>`;fc.appendChild(d);
    }
  }
  // list moons
  const ml=b.moons?(Array.isArray(b.moons)?b.moons:[b.moon]):[];
  if(ml.length){
    const d=document.createElement("div");d.style.marginTop="10px";
    d.innerHTML='<div style="color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Moons</div>';
    ml.forEach(m=>{
      const row=document.createElement("div");row.className="ft";
      row.innerHTML=`<span>${m.name}</span><span>${m.radius.toFixed(0)} km</span>`;
      d.appendChild(row);
    });
    fc.appendChild(d);
  }
}
function periodText(b){
  const d=b.period;
  if(d<1000) return d.toFixed(1)+" days";
  const yr=d/365.256;
  if(yr<2) return (d/365.256).toFixed(1)+" yrs";
  if(yr<50) return yr.toFixed(1)+" years";
  return (yr/1000).toFixed(1)+" thousand yrs";
}

// ---- controls ----
const speedEl=document.getElementById("speed");
const speedVal=document.getElementById("speedval");
function updateSpeed(){
  // exponential mapping 0..1000 -> 0.05 d/s .. 4000 d/s
  const v=+speedEl.value;
  if(v<=0){simSpeed=0;}
  else simSpeed=Math.pow(10, (Math.log10(4000)+v/1000*(6-Math.log10(4000)))/1);
  // simpler mapping:
  simSpeed = v<=0?0 : Math.round(Math.pow(10, -1.3 + (v/1000)*6.3));
  speedVal.textContent = simSpeedText(simSpeed);
}
function simSpeedText(s){
  if(s===0)return "Paused";
  if(s<60)return s.toFixed(1)+" day"+(s===1?"":"")+"/s";
  if(s<3000)return Math.round(s).toLocaleString()+" day/s";
  const days=s,years=days/365.256;
  if(years<365)return Math.round(years)+" yr/s";
  return (years/1000).toFixed(1)+"k yr/s";
}
speedEl.addEventListener("input",()=>{updateSpeed();VIEW.playing=true;setPlayBtn();});

const playBtn=document.getElementById("playBtn");
function setPlayBtn(){playBtn.textContent=VIEW.playing?"❚❚ Pause":"▶ Play";playBtn.classList.toggle("active",VIEW.playing);}
playBtn.onclick=()=>{VIEW.playing=!VIEW.playing;setPlayBtn();};

const zoomEl=document.getElementById("zoom");
zoomEl.addEventListener("input",()=>{cam.dist=+zoomEl.value*3.2;flyDist=null;});

function toggle(id,key){
  const el=document.getElementById(id);
  el.addEventListener("click",()=>{VIEW[key]=!VIEW[key];el.classList.toggle("active",VIEW[key]);});
}
toggle("tOrbits","showOrbits");toggle("tLabels","showLabels");
toggle("tRings","showRings");toggle("tBelt","showBelt");toggle("tSolarW","showWind");
document.getElementById("fitSun").onclick=()=>{cam.target=V(0,0,0);cam.dist=180;zoomEl.value=56;};
document.getElementById("today").onclick=()=>{setToday();};
document.getElementById("closeinfo").onclick=()=>{document.getElementById("infopanel").style.display="none";
  document.querySelectorAll(".objbtn").forEach(e=>e.classList.remove("sel"));selected=null;};

/* ---------- camera interaction (drag / zoom / doubleclick) ---------- */
let dragging=false, lastX=0,lastY=0;
const cv=document.getElementById("c");
cv.addEventListener("mousedown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;unfollow();});
window.addEventListener("mouseup",()=>{dragging=false;});
window.addEventListener("mousemove",e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  cam.yaw += dx*0.005;
  cam.pitch += dy*0.005;
  cam.pitch=Math.max(-1.5,Math.min(1.5,cam.pitch));
});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const f=e.deltaY>0?1.08:0.925;
  cam.dist=Math.max(5,Math.min(4000,cam.dist*f));
  zoomEl.value=Math.max(5,Math.min(800,cam.dist/3.2));
  flyDist=null; // manual zoom overrides the auto-focus distance
},{passive:false});
cv.addEventListener("dblclick",e=>{
  const hit=pickAt(e.clientX,e.clientY);
  if(hit){selectBody(hit);animateBodyFocus=hit;}
});
let animateBodyFocus=null;
// touch
let touchDist=0;
cv.addEventListener("touchstart",e=>{
  if(e.touches.length===1){dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
  else if(e.touches.length===2){touchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:false});
cv.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length===1&&dragging){
    const dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;
    lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
    cam.yaw+=dx*0.006;cam.pitch=Math.max(-1.5,Math.min(1.5,cam.pitch+dy*0.006));
  } else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const f=touchDist/d;touchDist=d;
    cam.dist=Math.max(8,Math.min(2000,cam.dist*f));
  }
},{passive:false});
cv.addEventListener("touchend",()=>{dragging=false;});

// pick body under pointer (screen-space by closest drawn sphere)
function pickAt(px,py){
  let best=null,bestD=14; // px tolerance
  const list=[];
  BODIES.forEach(b=>{ if(b.key==="sun")return; const p=bodyPos(b,tYears);
    const pr=project(p); if(pr){const r=Math.max(pr.s*b.renderR,6);
      const d=Math.hypot(px-pr.x,py-pr.y); if(d<bestD){bestD=d;best=b;}}});
  return best;
}

/* ---------- MAIN LOOP ---------------------------------------------- */
let lastT=performance.now();
function frame(now){
  const dtReal=Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(VIEW.playing && simSpeed>0) tYears += (dtReal*simSpeed)/365.256;

  // smooth camera transitions (button focus / drag override)
  if(flyTarget){
    cam.target.x+=(flyTarget.x-cam.target.x)*Math.min(1,dtReal*5);
    cam.target.y+=(flyTarget.y-cam.target.y)*Math.min(1,dtReal*5);
    cam.target.z+=(flyTarget.z-cam.target.z)*Math.min(1,dtReal*5);
    if(Math.hypot(flyTarget.x-cam.target.x,flyTarget.y-cam.target.y,flyTarget.z-cam.target.z)<0.3) flyTarget=null;
  }
  if(flyDist!=null){ cam.dist+=(flyDist-cam.dist)*Math.min(1,dtReal*5); }
  if(followBody){
    const p=bodyPos(followBody,tYears);
    cam.target.x+=(p.x-cam.target.x)*Math.min(1,dtReal*5);
    cam.target.y+=(p.y-cam.target.y)*Math.min(1,dtReal*5);
    cam.target.z+=(p.z-cam.target.z)*Math.min(1,dtReal*5);
  }

  // physics
  updateWind(dtReal*simSpeed, tYears);
  BODIES.forEach(b=>{
    if(b.isComet){ b.pos=bodyPos(b,tYears); updateCometTail(b,b.pos,dtReal*Math.max(0.02,simSpeed/30)); }
  });

  // render
  ctx.clearRect(0,0,W,H);
  drawNebula();
  drawStars();
  // faint radial vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.9);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,0.45)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  // orbit paths
  BODIES.forEach(b=>drawOrbit(b));

  // belts (behind planets, depth-sorted later handled by draw order)
  drawBelt(asteroids,tYears);
  drawBelt(kuiper,tYears);
  drawWind(tYears);

  // gather drawables for painter's sort
  const draws=[];
  const sp=bodyPos(sunBody,tYears); draws.push({d:camDepth(sp),kind:"sun",pos:sp,body:sunBody});
  BODIES.forEach(b=>{
    if(b.key==="sun")return;
    const p=bodyPos(b,tYears); b.pos=p;
    draws.push({d:camDepth(p),kind:"planet",pos:p,body:b});
    // moons
    const ml=b.moons?(Array.isArray(b.moons)?b.moons:[b.moon]):[];
    ml.forEach(m=>{
      const lp=moonLocal(m,tYears);
      const wp=V(p.x+lp.x,p.y+lp.y,p.z+lp.z);
      draws.push({d:camDepth(wp),kind:"moon",pos:wp,body:b,moon:m});
    });
  });
  draws.sort((a,b)=>b.d-a.d);  // far first

  for(const dr of draws){
    if(dr.kind==="sun"){
      const spr=project(dr.pos);
      if(!spr || isNaN(spr.x)||isNaN(spr.y)||!isFinite(spr.s)) continue;
      drawSun(spr);
      if(spr) drawLabel(dr.body, spr, spr.s*dr.body.renderR);
      continue;
    }
    if(dr.kind==="planet"){
      const pr=project(dr.pos);
      if(!pr || isNaN(pr.x)||isNaN(pr.y)||!isFinite(pr.s)) continue;
      // back ring half first (behind the disc), then planet, then front half
      if(VIEW.showRings && dr.body.ring){
        drawRings(dr.body,dr.pos,dr.body.ring,"back");
      }
      const info=drawSphere(dr.pos,dr.body.renderR,dr.body.color,dr.body.bands,null,false);
      if(VIEW.showRings && dr.body.ring){
        drawRings(dr.body,dr.pos,dr.body.ring,"front");
      }
      drawLabel(dr.body,pr,info.scr);
    }
    if(dr.kind==="moon"){
      const pr=project(dr.pos);
      if(pr) drawSphere(dr.pos,dr.moon.mR,dr.moon.color,null,dr.moon.m==="moon"?"earth":null,false);
      if(VIEW.showLabels && pr && pr.s*dr.moon.mR>0.6) drawLabel({name:dr.moon.name},pr,pr.s*dr.moon.mR);
    }
  }

  drawCometTails(tYears);

  // clock
  updateClock();
  requestAnimationFrame(frame);
}

function updateClock(){
  const yr=Math.floor(tYears)+2000;
  const frac=tYears-Math.floor(tYears);
  const day=Math.floor(frac*365.256);
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const miday=Math.floor((frac*365.256-day)*24);
  document.getElementById("clock").textContent=`J2000 + ${frac.toFixed(2)} yr  ·  ${yr} · day ${(day+1)} of orbit`;
}

/* ---------- bootstrap ---------------------------------------------- */
function boot(){
  resize();
  makeStars(1400);
  makeNebula();
  initBelt();
  buildList();
  updateSpeed();
  setPlayBtn();
  // initial nice framing
  cam.dist=210; zoomEl.value=Math.max(5,Math.min(800,cam.dist/3.2));
  // auto-select Sun
  selectBody(sunBody);
  document.getElementById("infopanel").style.display="none";
  document.getElementById("loading").style.display="none";
  requestAnimationFrame(frame);
}
boot();
